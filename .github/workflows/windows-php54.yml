name: Windows build PHP 5.4 (VC9)

# PHP 5.4 on Windows is built with Visual C++ 9 (Visual Studio 2008), x86 only. This job installs Visual
# Studio 2008 Express from Microsoft's ISO, builds PHP 5.4.45 in-tree with the extension as a shared module
# and loads the DLL into the official 5.4.45 VC9 x86 zip from windows.php.net as the test (a 5.4.45 build
# loads into every 5.4.x: same extension API). Manual trigger.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/windows-php54.yml']

jobs:
  build:
    name: PHP 5.4 ${{ matrix.ts }} x86
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        ts: [nts, ts]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ext

      - name: Unpack the VC9 compiler and Windows SDK 6.0A from the Visual Studio 2008 Express ISO
        # VS2008's setup.exe does not run on current Windows; its MSI packages unpack with an administrative
        # install (msiexec /a: files only, no installer logic). The compiler environment is then set by hand.
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          curl.exe -sSL -o "$t\vs2008.iso" https://download.microsoft.com/download/E/8/E/E8EEB394-7F42-4963-A2D8-29559B738298/VS2008ExpressWithSP1ENUX1504728.iso
          7z x -y "-o$t\iso" "$t\vs2008.iso" VCExpress\Ixpvc.exe VCExpress\WCU\WinSDK VCExpress\WCU\vcredist_x86.exe | Out-Null
          7z x -y "-o$t\ix" "$t\iso\VCExpress\Ixpvc.exe" | Out-Null
          7z x -y "-o$t\sdkb" "$t\iso\VCExpress\WCU\WinSDK\WinSDK_Build.exe" | Out-Null
          7z x -y "-o$t\sdkt" "$t\iso\VCExpress\WCU\WinSDK\WinSDK_Exp32Tools.exe" | Out-Null
          function Admin($msi, $dir) {
            $p = Start-Process msiexec.exe -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dir`"" -Wait -PassThru
            Write-Host "msiexec /a $(Split-Path $msi -Leaf) -> exit $($p.ExitCode)"
          }
          # vs_setup.msi refuses even an administrative install (1603); lessmsi reads its tables and writes the files
          choco install lessmsi -y --no-progress | Out-Null
          lessmsi x "$t\ix\vs_setup.msi" 'C:\vc9\' | Select-Object -Last 2 | Out-String | Write-Host
          Admin "$t\sdkb\winsdk_build.msi" 'C:\sdk6'
          Admin "$t\sdkb\VistaClientHeadersLibs-x86.msi" 'C:\sdk6'
          Admin "$t\sdkt\VistaClientExpressTools-x86.msi" 'C:\sdk6'
          $p = Start-Process "$t\iso\VCExpress\WCU\vcredist_x86.exe" -ArgumentList '/q' -Wait -PassThru
          Write-Host "vcredist_x86 (VC9 runtime) -> exit $($p.ExitCode)"
          $cl  = Get-ChildItem C:\vc9 -Recurse -Filter cl.exe -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          $pdb = Get-ChildItem C:\vc9 -Recurse -Filter mspdb80.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          $win = Get-ChildItem C:\sdk6 -Recurse -Filter windows.h -ErrorAction SilentlyContinue | Select-Object -First 1
          $rc  = Get-ChildItem C:\sdk6 -Recurse -Filter rc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $mt  = Get-ChildItem C:\sdk6 -Recurse -Filter mt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $k32 = Get-ChildItem C:\sdk6 -Recurse -Filter kernel32.lib -ErrorAction SilentlyContinue | Select-Object -First 1
          foreach ($x in @($cl, $pdb, $win, $rc, $mt, $k32)) { if ($x) { Write-Host "found $($x.FullName)" } }
          if (-not ($cl -and $pdb -and $win -and $rc -and $mt -and $k32)) { throw "VC9 toolchain incomplete" }
          $vc = $cl.Directory.Parent.FullName
          $sdk = $win.Directory.Parent.FullName
          # mc.exe (message compiler, for win32\build\wsyslog.mc) is not in the Express SDK subset; its output does not
          # depend on the compiler, so the runner's current Windows SDK copy is appended at the END of the path
          $mc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mc.exe -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'x86' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mc) { throw "mc.exe not found on the runner" }
          Write-Host "found $($mc.FullName)"
          "VC9_PATH=$($cl.DirectoryName);$($pdb.DirectoryName);$($rc.DirectoryName);$($mc.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VC9_INCLUDE=$vc\include;$sdk\Include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VC9_LIB=$vc\lib;$sdk\Lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $cl.FullName 2>&1 | Select-Object -First 1 | Out-String | Write-Host
          exit 0

      - name: PHP SDK tools (legacy) and PHP 5.4.45 source
        shell: pwsh
        run: |
          curl.exe -sSL -o sdk.zip https://github.com/php/php-sdk-binary-tools/archive/refs/heads/legacy.zip
          Expand-Archive sdk.zip -DestinationPath sdk
          curl.exe -sSL -o php-src.zip https://windows.php.net/downloads/releases/archives/php-5.4.45-src.zip
          Expand-Archive php-src.zip -DestinationPath phpsrc
          $src = Get-ChildItem phpsrc -Directory | Select-Object -First 1
          Rename-Item $src.FullName php
          Copy-Item -Recurse ext phpsrc\php\ext\hp_uploadprogress_guard

      - name: Build PHP 5.4.45 with the extension as a shared module
        shell: cmd
        run: |
          set PATH=%CD%\sdk\php-sdk-binary-tools-legacy\bin;%PATH%
          set PATH=%VC9_PATH%;%PATH%
          set INCLUDE=%VC9_INCLUDE%
          set LIB=%VC9_LIB%
          cl 2>&1 | findstr /C:"Version"
          cd phpsrc\php
          call buildconf.bat
          if "${{ matrix.ts }}"=="nts" (set ZTSFLAG=--disable-zts) else (set ZTSFLAG=)
          call configure.bat --disable-all --enable-cli --enable-hp-uploadprogress-guard=shared %ZTSFLAG%
          nmake
          dir /s /b php_hp_uploadprogress_guard.dll php.exe

      - name: Collect the DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem phpsrc\php -Recurse -Filter php_hp_uploadprogress_guard.dll | Select-Object -First 1
          if (-not $dll) { throw "DLL not built" }
          New-Item -ItemType Directory out | Out-Null
          Copy-Item $dll.FullName "out\php_hp_uploadprogress_guard-5.4-${{ matrix.ts }}-vc9-x86.dll"
          Get-ChildItem out

      - name: Load the DLL in the official PHP 5.4.45 VC9 x86 build
        shell: pwsh
        run: |
          $nts = if ('${{ matrix.ts }}' -eq 'nts') { '-nts' } else { '' }
          curl.exe -sSL -o php.zip "https://windows.php.net/downloads/releases/archives/php-5.4.45${nts}-Win32-VC9-x86.zip"
          Expand-Archive php.zip -DestinationPath php54
          $dll = (Get-ChildItem out\*.dll).FullName
          & php54\php.exe -n -r "echo PHP_VERSION, ' ', PHP_ZTS ? 'ts' : 'nts', ' ', PHP_INT_SIZE * 8, 'bit', PHP_EOL;"
          $out = & php54\php.exe -n -d "extension=$dll" --ri hp_uploadprogress_guard 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'version => 3\.' -or $out -match 'Unable to load|Warning') { throw "DLL did not load" }

      - uses: actions/upload-artifact@v4
        with:
          name: php_hp_uploadprogress_guard-5.4-${{ matrix.ts }}-vc9-x86
          path: out/*.dll
