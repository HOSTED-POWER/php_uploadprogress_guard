---
## Mitigation for CVE-2026-109618 / CVE-2026-109619 (ext/session multipart upload-progress handler).
## A tiny extension (source + build script in files/uploadprogress-guard/src) detaches ext/session's
## rfc1867 callback at module init, so the affected handler can no longer be reached by a request.
## This is independent of session.upload_progress.enabled, which customers can flip back on from
## .user.ini / ini_set(). Only the session.upload_progress feature is lost; uploads keep working.
## Applied to EVERY installed php-fpm version (also phpmyadmin's dedicated one), not only the vhost
## versions, since any php endpoint parses multipart bodies before the application runs.
## Debian/Sury only: the .so files are built per PHP minor against the NTS API Sury ships, and are
## installed like any other module: /usr/lib/php/<API>/hp_uploadprogress_guard.so + mods-available ini.

- name: Discover installed php-fpm versions -> /usr/sbin/php-fpmX.Y
  ansible.builtin.find:
    paths: /usr/sbin
    patterns: 'php-fpm[0-9].[0-9]'
    use_regex: false
  register: php_uploadprogress_guard_fpm_binaries

## The .so files are built per PHP minor AND per CPU architecture: hp_uploadprogress_guard-X.Y-<arch>.so, where <arch>
## is the `uname -m` name (x86_64, aarch64) and therefore equals ansible_architecture. Needs gathered facts.
- name: set fact php_uploadprogress_guard_arch
  ansible.builtin.set_fact:
    php_uploadprogress_guard_arch: "{{ ansible_facts['architecture'] }}"

## Only versions with a shipped .so (files/uploadprogress-guard/hp_uploadprogress_guard-X.Y-<arch>.so = every minor Sury publishes, 5.6-8.5).
- name: set fact php_uploadprogress_guard_versions
  ansible.builtin.set_fact:
    php_uploadprogress_guard_versions: "{{ php_uploadprogress_guard_fpm_binaries.files | map(attribute='path') | map('basename') | map('regex_replace', '^php-fpm', '') | intersect(php_uploadprogress_guard_shipped_versions) | sort }}"
  vars:
    php_uploadprogress_guard_shipped_versions: "{{ lookup('ansible.builtin.fileglob', 'uploadprogress-guard/*-' ~ php_uploadprogress_guard_arch ~ '.so') | regex_findall('-([0-9]+\\.[0-9]+)-' ~ php_uploadprogress_guard_arch ~ '\\.so') }}"

- name: Query extension_dir of php {{ php_uploadprogress_guard_versions | join(', ') }}
  ansible.builtin.command: "php{{ item }} -n -r 'echo PHP_EXTENSION_DIR;'"
  loop: "{{ php_uploadprogress_guard_versions }}"
  register: php_uploadprogress_guard_extension_dirs
  changed_when: false

- block:
    - name: hp_uploadprogress_guard-{{ item.item }}-{{ php_uploadprogress_guard_arch }}.so -> {{ item.stdout }}/hp_uploadprogress_guard.so
      ansible.builtin.copy:
        src: "uploadprogress-guard/hp_uploadprogress_guard-{{ item.item }}-{{ php_uploadprogress_guard_arch }}.so"
        dest: "{{ item.stdout }}/hp_uploadprogress_guard.so"
        mode: '0644'
      loop: "{{ php_uploadprogress_guard_extension_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"
      notify: restart php-fpm uploadprogress guard versions

    - name: hp_uploadprogress_guard.ini -> /etc/php/{{ item }}/mods-available/hp_uploadprogress_guard.ini
      ansible.builtin.copy:
        src: hp_uploadprogress_guard.ini
        dest: "/etc/php/{{ item }}/mods-available/hp_uploadprogress_guard.ini"
        mode: '0644'
      loop: "{{ php_uploadprogress_guard_versions }}"
      notify: restart php-fpm uploadprogress guard versions

    - name: phpenmod hp_uploadprogress_guard -> all SAPIs of {{ php_uploadprogress_guard_versions | join(', ') }}
      ansible.builtin.command: "phpenmod -v {{ item }} -s ALL hp_uploadprogress_guard"
      args:
        creates: "/etc/php/{{ item }}/fpm/conf.d/20-hp_uploadprogress_guard.ini"
      loop: "{{ php_uploadprogress_guard_versions }}"
      notify: restart php-fpm uploadprogress guard versions

  when: php_uploadprogress_guard_enabled | bool

- block:
    - name: phpdismod hp_uploadprogress_guard -> all SAPIs of {{ php_uploadprogress_guard_versions | join(', ') }}
      ansible.builtin.command: "phpdismod -v {{ item }} -s ALL hp_uploadprogress_guard"
      args:
        removes: "/etc/php/{{ item }}/fpm/conf.d/20-hp_uploadprogress_guard.ini"
      loop: "{{ php_uploadprogress_guard_versions }}"
      notify: restart php-fpm uploadprogress guard versions

    - name: Remove hp_uploadprogress_guard.ini -> /etc/php/{{ item }}/mods-available/hp_uploadprogress_guard.ini
      ansible.builtin.file:
        path: "/etc/php/{{ item }}/mods-available/hp_uploadprogress_guard.ini"
        state: absent
      loop: "{{ php_uploadprogress_guard_versions }}"

    - name: Remove hp_uploadprogress_guard.so -> {{ item.stdout }}/hp_uploadprogress_guard.so
      ansible.builtin.file:
        path: "{{ item.stdout }}/hp_uploadprogress_guard.so"
        state: absent
      loop: "{{ php_uploadprogress_guard_extension_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

  when: not php_uploadprogress_guard_enabled | bool
